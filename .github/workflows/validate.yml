name: Validate scaffold
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate content
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          .venv/bin/python tools/validate.py
          .venv/bin/python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Download pinned Godot and verify release checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          base="https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable"
          file="Godot_v4.5.1-stable_linux.x86_64.zip"
          curl --fail --location --retry 3 "$base/$file" --output "$file"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" --output SHA512-SUMS.txt
          grep " $file$" SHA512-SUMS.txt > CHECKSUM
          sha512sum --check CHECKSUM
          unzip -q "$file"
          chmod +x Godot_v4.5.1-stable_linux.x86_64
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Import, runtime tests and scene smoke
        run: .venv/bin/python tools/check_godot.py --godot Godot_v4.5.1-stable_linux.x86_64
